name: Validate with hassfest

on:
  push:
    branches:
      - int
      - test
      - stage
  pull_request:
    branches:
      - int
      - test
      - stage
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "home-assistant/actions/hassfest@master"
        with:
          ignore: "brands"